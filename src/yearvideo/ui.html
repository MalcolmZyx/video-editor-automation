<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Month Editor</title>
<style>
  :root { --bg:#12141a; --panel:#1b1f27; --card:#232832; --line:#8883; --fg:#eceff4; --mut:#8f98a8;
          --acc:#5aa9ff; --bad:#ff6b6b; --ok:#5fd38d; --cap:#c58bff; --mus:#f2b84b; }
  @media (prefers-color-scheme: light) { :root { --bg:#eef0f4; --panel:#fff; --card:#f7f8fa; --fg:#1b1f27; --mut:#667085; } }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; display:flex; flex-direction:column; }
  button, select, input, textarea { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:5px 9px; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); color:#fff; border-color:transparent; }
  button.on { background:var(--acc); color:#fff; border-color:transparent; }
  input[type=number] { width:74px; } input[type=color] { padding:0; width:34px; height:28px; }
  input[type=range] { padding:0; width:120px; }
  label { display:inline-flex; gap:6px; align-items:center; }
  .mut { color:var(--mut); } .bad { color:var(--bad); } .ok { color:var(--ok); }

  header { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header .grp { display:flex; gap:8px; align-items:center; padding-right:18px; border-right:1px solid var(--line); }
  header .grp:last-child { border:0; margin-left:auto; padding:0; }
  header h1 { font-size:15px; margin:0; }

  main { flex:1; overflow:auto; padding:14px 16px 28px; }
  h2 { font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--mut); margin:22px 0 8px; display:flex; gap:10px; align-items:center; }
  .panels { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:10px; align-items:start; }
  details.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  details.panel > summary { padding:9px 12px; cursor:pointer; font-weight:600; }
  .fields { display:grid; gap:9px; padding:4px 12px 12px; }
  .fields .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .fields .row > span:first-child { display:flex; align-items:center; gap:6px; }
  .i { width:18px; height:18px; padding:0; border-radius:50%; font-size:11px; line-height:16px; text-align:center;
       color:var(--acc); border-color:var(--acc); background:transparent; flex:none; }
  #tip { position:fixed; z-index:80; max-width:360px; background:#000e; color:#fff; padding:10px 12px; border-radius:8px;
         font-size:13px; line-height:1.4; box-shadow:0 6px 24px #0008; display:none; white-space:pre-line; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(256px, 1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .card.off { opacity:.55; } .card.sel { outline:2px solid var(--acc); }
  .card .thumb { width:100%; aspect-ratio:16/9; object-fit:cover; display:grid; place-items:center; cursor:pointer; background:#000; color:#fff; font-size:18px; text-align:center; }
  .card .b { padding:8px; display:grid; gap:6px; }
  .name { font-size:12px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row { display:flex; gap:6px; align-items:center; justify-content:space-between; }
  .row .lbl { display:flex; gap:5px; align-items:center; font-size:13px; white-space:nowrap; }
  .row input[type=number] { width:96px; }
  .badge { font-size:11px; padding:1px 7px; border-radius:10px; background:#8883; white-space:nowrap; }
  .sub { border-top:1px dashed var(--line); padding-top:6px; display:grid; gap:6px; }

  .songs { display:grid; gap:6px; }
  .song { display:flex; gap:8px; align-items:center; background:var(--card); border-radius:6px; padding:4px 8px; }
  .song .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .song.in { border-left:3px solid var(--mus); }

  /* ---------- editor dock ---------- */
  #dock { background:var(--panel); border-top:2px solid var(--line); height:380px; display:grid; grid-template-columns:420px minmax(0,1fr) 310px; min-height:0; }
  #dock.min { height:44px; }
  #dock.min #player, #dock.min #tlscroll, #dock.min #insp { display:none; }
  #player { padding:8px 10px; display:grid; grid-template-rows:auto auto 1fr; gap:6px; min-height:0; border-right:1px solid var(--line); align-content:start; overflow:auto; }
  #player .tabs { display:flex; gap:4px; }
  #player .tabs button { padding:3px 10px; font-size:13px; }
  .stage { position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden; border-radius:6px; user-select:none; touch-action:none; }
  .stage .m { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; display:none; }
  .stage .fadeov { position:absolute; inset:0; pointer-events:none; opacity:0; z-index:5; }
  .stage .caps { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:6; }
  .stage .cap { position:absolute; transform-origin:center; white-space:pre-wrap; line-height:1.25; pointer-events:auto; cursor:move; }
  .stage .cap.ghost { opacity:.35; outline:1px dashed #fff8; }
  .stage .cap.sel { outline:1px dashed var(--acc); }
  .cap .hnd { position:absolute; width:12px; height:12px; background:var(--acc); border:2px solid #fff; border-radius:50%; display:none; }
  .cap.sel .hnd { display:block; }
  .cap .hnd.rot { left:calc(50% - 6px); top:-26px; cursor:grab; }
  .cap .hnd.siz { right:-8px; bottom:-8px; border-radius:2px; cursor:nwse-resize; }
  .ctl { display:flex; gap:8px; align-items:center; }
  .ctl input[type=range] { flex:1; width:auto; }
  #vidBox video, #vidBox .none { width:100%; aspect-ratio:16/9; background:#000; border-radius:6px; }
  #vidBox .none { display:grid; place-items:center; color:#aaa; text-align:center; padding:10px; }
  #tlwrap { display:grid; grid-template-rows:auto 1fr; min-width:0; min-height:0; }
  #tlbar { display:flex; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #tlscroll { overflow:auto; position:relative; min-height:0; }
  #tl { position:relative; margin-left:74px; min-height:100%; }
  .lane { position:relative; height:44px; border-bottom:1px solid var(--line); }
  .lane::before { content:attr(data-name); position:absolute; left:-72px; top:0; width:68px; height:100%; display:flex; align-items:center; font-size:12px; color:var(--mut); }
  .ruler { height:22px; position:relative; border-bottom:1px solid var(--line); font-size:10px; color:var(--mut); }
  .tick { position:absolute; top:0; height:100%; border-left:1px solid var(--line); padding-left:3px; }
  .blk { position:absolute; top:4px; height:36px; border-radius:5px; overflow:hidden; font-size:11px; padding:3px 5px; cursor:pointer;
         color:#fff; border:1px solid #fff4; white-space:nowrap; text-overflow:ellipsis; }
  .blk.sel { outline:2px solid #fff; z-index:3; }
  .blk.cap { background:var(--cap); color:#1b1230; cursor:grab; }
  .blk .h { position:absolute; top:0; width:7px; height:100%; cursor:ew-resize; background:#0004; }
  .blk .h.l { left:0; } .blk .h.r { right:0; }
  .blk.mus { background:var(--mus); color:#2a1d00; cursor:grab; }
  .blk.mus.auto { cursor:pointer; opacity:.9; background-image:repeating-linear-gradient(45deg, #0000 0 6px, #0001 6px 12px); }
  .beat { position:absolute; top:0; width:1px; height:100%; background:#0003; pointer-events:none; }
  #playhead { position:absolute; top:0; bottom:0; width:2px; background:var(--bad); z-index:5; pointer-events:none; }
  #insp { border-left:1px solid var(--line); padding:10px; overflow:auto; display:grid; gap:7px; align-content:start; }
  #insp .f { display:grid; grid-template-columns:92px 1fr; gap:6px; align-items:center; }
  #insp .f input[type=number], #insp .f input[type=text], #insp .f select, #insp .f textarea { width:100%; }
  #insp textarea { height:58px; resize:vertical; }
  #insp h3 { margin:0; font-size:13px; display:flex; gap:8px; align-items:center; }
  .fp { position:relative; }
  .fp > button { width:100%; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:16px; }
  .fp .list { position:fixed; z-index:70; overflow:auto; background:var(--panel); border:1px solid var(--acc); border-radius:8px; box-shadow:0 8px 24px #0006; }
  .fp .list input { width:calc(100% - 12px); margin:6px; position:sticky; top:6px; }
  .fp .opt { padding:5px 10px; cursor:pointer; border-bottom:1px solid var(--line); min-height:52px; }
  .fp .opt:hover, .fp .opt.cur { background:#5aa9ff33; }
  .fp .opt small { color:var(--mut); display:block; }
  .fp .opt .sample { font-size:22px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .join { position:absolute; top:14px; width:16px; height:16px; margin-left:-8px; background:var(--acc); transform:rotate(45deg) scale(.75);
          border:2px solid #fff; z-index:4; cursor:pointer; }
  .join.cut { background:#667; }
  .join.sel { outline:3px solid #fff; }
  .lane.drop { background:#5aa9ff26; }
  /* ---------- trim modal ---------- */
  #modal { position:fixed; inset:0; background:#000a; z-index:50; display:none; place-items:center; }
  #modal .box { background:var(--panel); border-radius:10px; padding:14px; width:min(760px, 94vw); display:grid; gap:10px; }
  #modal video { width:100%; max-height:48vh; background:#000; border-radius:6px; }
  #range { position:relative; height:30px; background:var(--card); border-radius:6px; }
  #range .sel { position:absolute; top:0; bottom:0; background:var(--acc); opacity:.45; border-radius:4px; }
  #range .ph { position:absolute; top:0; bottom:0; width:2px; background:var(--bad); }
  #range input { position:absolute; left:0; right:0; width:100%; top:5px; background:none; border:0; pointer-events:none; -webkit-appearance:none; }
  #range input::-webkit-slider-thumb { pointer-events:auto; }
  #toast { position:fixed; right:14px; top:14px; z-index:90; background:var(--bad); color:#fff; padding:8px 12px; border-radius:8px; display:none; max-width:420px; }
</style>
</head>
<body>
<header>
  <div class="grp">
    <h1>Month Editor</h1>
    <select id="monthSel" title="Choose the month to edit"></select>
    <span id="status"></span>
  </div>
  <div class="grp">
    <button id="btnRefresh">Rescan folder</button><button class="i" data-k="rescan">i</button>
  </div>
  <div class="grp">
    <button id="btnPreview">Render preview</button><button class="i" data-k="preview">i</button>
    <button id="btnFinal" class="primary">Render final</button><button class="i" data-k="final">i</button>
    <span id="rstatus" class="badge">idle</span>
  </div>
</header>

<main>
  <h2>Month settings <button class="i" data-k="settings">i</button></h2>
  <div class="panels" id="panels"></div>

  <h2>Storyboard <span class="mut" style="text-transform:none;letter-spacing:0">— the order the photos and clips play in</span>
    <button class="i" data-k="storyboard">i</button>
    <button id="btnAddCard">+ Colour card at end</button><button class="i" data-k="card">i</button></h2>
  <div id="kept" class="grid"></div>
  <h2 id="dh">Dropped</h2>
  <div id="dropped" class="grid"></div>
  <div style="height:20px"></div>
</main>

<section id="dock">
  <div id="player">
    <div class="tabs">
      <button data-tab="live" class="on">Live preview</button><button data-tab="preview">Rendered preview</button><button data-tab="final">Final</button>
      <button class="i" data-k="live">i</button>
    </div>
    <div id="liveBox">
      <div class="stage" id="stage"><div class="fadeov" id="fadeov"></div><div class="caps" id="caps"></div></div>
      <div class="ctl" style="margin-top:6px"><button id="btnPlay" title="Play / pause (space)">▶</button>
        <input type="range" id="scrub" min="0" max="1000" value="0"><span class="mut" id="time">0.0 / 0.0s</span></div>
    </div>
    <div id="vidBox" style="display:none"></div>
  </div>
  <div id="tlwrap">
    <div id="tlbar">
      <button id="btnDock" title="Collapse / expand the editor">⇵</button>
      <button id="btnAddCap">+ Caption at current time</button><button class="i" data-k="caption">i</button>
      <select id="layerSel" title="Pick a song to play ON TOP of the main music"></select>
      <button id="btnAddLayer">+ Add song layer</button><button class="i" data-k="layer">i</button>
      <label>Zoom <input id="zoom" type="range" min="1" max="12" step="0.5" value="1"></label>
      <span id="stale" class="badge" style="display:none"></span>
    </div>
    <div id="tlscroll"><div id="tl"></div></div>
  </div>
  <div id="insp"></div>
</section>

<div id="modal"><div class="box" id="trimbox"></div></div>
<div id="tip"></div>
<div id="toast"></div>
<audio id="songAudio"></audio>

<script>
// ------------------------------------------------------------------ help texts
const INFO = {
  rescan: "Looks at the month's folder again.\nNew photos, videos or songs you added are picked up (in date order); files you deleted are removed.\nEverything you already decided — kept/dropped, lengths, captions, music, settings — stays exactly as it is.",
  preview: "Builds a small, fast video file (640×360) of this month. You usually don't need it: the LIVE preview already shows your edits instantly. Use it to check the exact result.",
  final: "Builds the full-quality video for this month at the resolution in your config. The 'year' command joins the finished months into the yearly video.",
  live: "Live preview plays your edits instantly as you make them: photos, clips, transitions, fades, cards, captions and music. It is a close approximation (small differences in text spacing are possible). 'Rendered preview' and 'Final' show real video files.",
  settings: "These settings belong to this month only. New months start from config/default.yaml. Your changes are saved automatically and are never overwritten when you rescan.",
  storyboard: "Every kept photo/clip in playing order. Untick 'keep' to leave something out (it moves to Dropped, where you can bring it back). Use ▲▼ to reorder.",
  card: "A blank card in any colour (optionally with centred text) that you can put anywhere in the order — for example between two parts of the month.",
  caption: "Adds a text caption that starts at the moment the preview is currently showing (where the red line is in the timeline). Then: drag the text in the preview to move it, use the round handle above it to rotate and the square corner to resize. Drag the purple block in the timeline to change when it shows, or drag its edges to lengthen/shorten it. All other options are in the panel on the right.",
  layer: "Plays another song AT THE SAME TIME as the main music, starting at the current time. It gets its own row in the timeline: drag it to move it, drag its edges to trim it, and set its volume and fades in the panel on the right. Use it for a second song, an ambient sound, etc.",
  photo_len: "Shortest and longest time a photo may be shown. When items have no fixed length, the editor picks lengths inside this range so the month fits the music.",
  video_len: "Shortest and longest a video clip may play. Longer clips are cut down to their best moment (sharp, moving, not dark). You can set the exact start and end yourself with Trim.",
  card_len: "How long a new colour card shows by default.",
  beat_sync: "Off: lengths are spread evenly, ignoring the beat.\nSnap: each cut is gently pulled toward the nearest beat (how strongly is the 'Strength' setting) while everything stays inside the length limits.\nOn beat: every cut lands exactly on a beat (can look mechanical — try 'every 2nd beat').",
  beat_strength: "Only for Snap. 0% = ignore the beat, 100% = land exactly on it. Around 40–70% keeps the rhythm without looking robotic.",
  beat_every: "Use only every 2nd (or 4th) beat as a place to cut. Gives calmer pacing, because photos last 2 or 4 beats instead of 1.",
  transition: "How one photo/clip changes into the next. 'cut' = instant. 'fade' = cross-dissolve: the next picture gradually appears over the previous one. Others wipe or slide. You can override the transition for any single join in the storyboard.",
  transition_s: "How long the blend takes. It can't be longer than the clips on either side allow.",
  transition_a: "Where the blend sits relative to the cut point (the moment one item ends and the next begins):\nstarts at the cut — the blend begins there.\ncentered on the cut — the cut point is the middle of the blend (looks most natural with beat sync).\nends at the cut — the new picture is fully visible exactly at the cut.\nThe month never gets longer; only how the blend overlaps changes.",
  fade_video: "Fades the picture up from (and back down to) a plain colour at the very start and end of the month, so months don't hard-cut into each other in the yearly video. This is NOT between photos — use Transition for that. 0 = off.",
  fade_color: "The colour used for the month-start / month-end fade (and for any single-item fade you set on a card). Black is typical; white looks airy.",
  music_in: "At the beginning of the month the music starts silent and rises to full volume over this many seconds. 0 = music starts at full volume.",
  music_out: "When a song is stopped before it ends on its own (cut short, or the month finishes mid-song), the music fades out over this many seconds instead of stopping abruptly. Songs that end naturally aren't touched.",
  keep_sound: "Keep the original sound recorded in your video clips. You can override this for each clip (the 'sound' dropdown on its card).",
  music_vol: "Loudness of all the music. 100% = unchanged. The music is never lowered when a clip's own sound plays — clip sound is mixed underneath it.",
  video_vol: "Loudness of clip sound (relative to the original). It stays low by default so it acts as background sound under the music. Each clip also has its own volume multiplier.",
  cap_style: "Starting look for NEW captions. Each caption can then be changed individually in the panel on the right.",
  playlist: "The songs this month plays, in order. Use ▶ to listen. Remove a song or add another from the list below, then the month is re-planned to fit.",
  library: "Optional: a folder on your computer with lots of songs (for example D:/Music/Videos). Songs in it appear in 'Choose another song' so you can pick one without copying files into the month's folder.",
  mode: "How songs are fitted to the month's length.\n\nfit — use ONE song from where the real music starts to where it ends (skipping silent intro and trailing quiet). Works when the month's photos/clips naturally add up to about that length.\n\nloop_cut — use only the first section of the song (e.g. through the first chorus), fade it out, and add another song if the month is longer.\n\nmulti_song — play several songs back to back until the month is filled.\n\nshared_song — use part of a song and continue it in the next month.\n\nmanual — YOU place and trim every song in the timeline (the month length follows your music).",
  section: "Only used by loop_cut. The song is divided into sections (verse, chorus...). 0 = stop after the first section, 1 = after the second, and so on.",
  manual: "Turns the automatic music plan into clips you can drag, trim and re-time yourself in the timeline. The month length then follows your music. You can switch back to an automatic mode any time (your hand-made clips are kept).",
  join: "The change between two neighbouring pictures/clips (the diamonds on the Clips row). Every join can have its own style, length and blend position, whatever the two sides are (photo → video, video → card, ...). Leave a field on 'default' to follow the month setting. Select a diamond and press Backspace to make it a hard cut.",
  delete: "Backspace or Delete removes whatever is selected in the timeline: a caption, a song, a clip (it goes to 'Dropped' so you can restore it), a colour card, or (for a transition) turns it into a hard cut. Ctrl+Z undoes.",
  manual_len: "The length of the month in manual music mode. The photos and clips are re-timed to fit this length. Dragging a song in the timeline no longer changes it, so you can slide music around freely. 'Follow the music' sets the length to where your music ends.",
  keep_item: "Untick to leave this out of the video. It stays in the Dropped list so you can restore it.",
  len_item: "How long this shows. Empty = automatic: the editor chooses so the month fits the music (within your Lengths settings). The grey text shows what it is using right now.",
  trim: "Opens the clip so you can pick exactly where it starts and ends while watching it. 'Auto' = the editor picks the best moment for you.",
  sound_item: "default: follow the month setting. keep: play this clip's own sound quietly under the music. mute: no clip sound. The number multiplies the clip's loudness.",
  fade_item: "Fade this item in from / out to the fade colour (seconds). Empty = automatic: only the first item of the month fades in and only the last fades out. Ignored where a cross-fade/transition already blends two items.",
  trans_item: "How THIS item changes into the next one. 'default' follows the month's Transition setting. Choose cut for a hard cut here.",
};

const TRANSITIONS = ['cut','fade','fadeblack','fadewhite','dissolve','wipeleft','wiperight','wipeup','wipedown','slideleft','slideright','slideup','slidedown','circleopen','circleclose','pixelize','radial'];
const SETTINGS = [
  { title:'Lengths', rows:[
    ['limits.photo_min','Photo shortest (s)','number',{step:.5,min:.5},'photo_len'],
    ['limits.photo_max','Photo longest (s)','number',{step:.5,min:.5},'photo_len'],
    ['limits.video_min','Clip shortest (s)','number',{step:.5,min:.5},'video_len'],
    ['limits.video_max','Clip longest (s)','number',{step:.5,min:.5},'video_len'],
    ['card.seconds','New card length (s)','number',{step:.5,min:.5},'card_len'] ]},
  { title:'Beat sync', rows:[
    ['beat_sync','Cuts follow the beat','select',['off','snap','on_beat'],'beat_sync'],
    ['beat_strength','Snap strength','range',{min:0,max:1,step:.05},'beat_strength'],
    ['beat_every','Use every Nth beat','select',[1,2,4],'beat_every'] ]},
  { title:'Transitions between items', rows:[
    ['transition.type','Style (fade = cross-dissolve)','select',TRANSITIONS,'transition'],
    ['transition.seconds','Length (s)','number',{step:.1,min:.1,max:3},'transition_s'],
    ['transition.align','Blend sits','select',[['start','starts at the cut'],['center','centered on the cut'],['end','ends at the cut']],'transition_a'] ]},
  { title:'Month start / end fades', rows:[
    ['fade.video_in','Picture fade in (s)','number',{step:.1,min:0},'fade_video'],
    ['fade.video_out','Picture fade out (s)','number',{step:.1,min:0},'fade_video'],
    ['fade.color','Fade colour','color',{},'fade_color'],
    ['fade.music_in','Music fade in (s)','number',{step:.1,min:0},'music_in'],
    ['fade.music_out','Music fade out when cut short (s)','number',{step:.1,min:0},'music_out'] ]},
  { title:'Sound levels', rows:[
    ['sound.keep_video_sound','Keep video sound by default','checkbox',{},'keep_sound'],
    ['sound.music_volume','Music volume','range',{min:0,max:1.5,step:.05},'music_vol'],
    ['sound.video_volume','Video sound volume','range',{min:0,max:1.5,step:.05},'video_vol'] ]},
  { title:'New caption style', rows:[
    ['caption_style.size','Text size (% of height)','number',{step:.5,min:1,max:30},'cap_style'],
    ['caption_style.color','Text colour','color',{},'cap_style'],
    ['caption_style.background','Box colour','color',{},'cap_style'],
    ['caption_style.background_opacity','Box opacity (0 = no box)','number',{step:.05,min:0,max:1},'cap_style'],
    ['caption_style.y','Vertical position (0 top – 1 bottom)','number',{step:.05,min:0,max:1},'cap_style'],
    ['caption_style.fade','Fade (s)','number',{step:.1,min:0},'cap_style'] ]},
];

// ------------------------------------------------------------------ state + helpers
let availOpen = false, tl = null, months = [], cur = null, songs = [], fonts = [], sel = null, stat = {}, tab = 'live', saving = null, dragging = false;
let T = 0, playing = false, tStart = 0, t0 = 0;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = (s) => s.split('/').map(encodeURIComponent).join('/');
const fmt = (x) => (x == null ? '—' : (Math.round(x * 10) / 10).toFixed(1));
const i = (k) => `<button class="i" data-k="${k}" title="What is this?">i</button>`;
const getp = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const setp = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
const hex = (c) => /^#[0-9a-f]{6}$/i.test(c) ? c : ({black:'#000000', white:'#ffffff'}[String(c).toLowerCase()] || '#000000');
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const uid = () => Math.random().toString(16).slice(2, 10);

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 6000); }
async function api(path, body) {
  const url = path + (path.includes('?') ? '&' : '?') + 'm=' + encodeURIComponent(cur);
  const r = await fetch(url, body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  const j = await r.json();
  if (j && j.error) { toast(j.error); throw new Error(j.error); }
  return j;
}
let undoStack = [], undoPending = false, lastSaved = '';
function pushUndo() { if (undoPending) return; undoStack.push(lastSaved); if (undoStack.length > 60) undoStack.shift(); undoPending = true; }
function saveSoon() { pushUndo(); clearTimeout(saving); $('status').textContent = 'saving…'; renderLive(); drawTimeline(); saving = setTimeout(save, 350); }
async function save() {
  if (dragging) { saving = setTimeout(save, 200); return; }
  const fresh = await api('/api/timeline', tl);
  if (dragging) return;
  tl = fresh; undoPending = false; lastSaved = JSON.stringify(tl); drawAll();
}
async function act(path, body) {   // server-side edits (music, cards): undoable like everything else
  pushUndo(); tl = await api(path, body); undoPending = false; lastSaved = JSON.stringify(tl); return tl;
}
async function undo() {
  if (!undoStack.length) return toast('Nothing to undo');
  tl = JSON.parse(undoStack.pop()); sel = null; undoPending = false;
  tl = await api('/api/timeline', tl); lastSaved = JSON.stringify(tl); drawAll();
}
function removeClip(id) {
  const c = (tl.audio_clips || []).find(x => x.id === id); if (!c) return;
  if (c.auto) tl.music.playlist = tl.music.playlist.filter(f => f !== c.file);   // automatic music comes from the playlist
  tl.music.layers = (tl.music.layers || []).filter(x => x.id !== id);
  tl.music.clips = (tl.music.clips || []).filter(x => x.id !== id);
  sel = null; drawInspector(); saveSoon();
}
function deleteSelected() {
  if (!sel) return;
  if (sel.type === 'mc') return removeClip(sel.id);
  if (sel.type === 'cap') tl.captions = tl.captions.filter(x => x.id !== sel.id);
  else if (sel.type === 'join') { const it = tl.items.find(x => x.id === sel.id); if (it) { it.transition_type = 'cut'; it.transition_out = 0; } }
  else if (sel.type === 'item') { const it = tl.items.find(x => x.id === sel.id); if (it) { if (it.kind === 'card') tl.items = tl.items.filter(x => x !== it); else it.keep = false; } }
  sel = null; drawInspector(); saveSoon();
}
const kept = () => tl.items.filter(x => x.keep && x.duration);
const total = () => Math.max(tl.total || 1, 1);
const songName = (f) => String(f).split('/').pop();

// info popovers
document.addEventListener('click', (e) => {
  const b = e.target.closest('.i');
  const tip = $('tip');
  if (b && INFO[b.dataset.k]) {
    const r = b.getBoundingClientRect();
    tip.textContent = INFO[b.dataset.k];
    tip.style.display = 'block';
    tip.style.left = Math.max(8, Math.min(r.left, innerWidth - 380)) + 'px';
    const below = r.bottom + 6 + tip.offsetHeight < innerHeight;
    tip.style.top = (below ? r.bottom + 6 : Math.max(8, r.top - 6 - tip.offsetHeight)) + 'px';
    e.stopPropagation();
  } else if (!e.target.closest('#tip')) tip.style.display = 'none';
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('tip').style.display = 'none'; closeTrim(); }
  const ae = document.activeElement, tag = ae ? ae.tagName : '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || (ae && ae.isContentEditable) || $('modal').style.display === 'grid') return;
  if (e.key === ' ' && tag !== 'BUTTON' && tab === 'live') { e.preventDefault(); togglePlay(); }
  else if ((e.key === 'Backspace' || e.key === 'Delete') && sel) { e.preventDefault(); deleteSelected(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
});

  const sel_ = $('monthSel');
  sel_.innerHTML = months.map(m => `<option>${esc(m.name)}</option>`).join('');
  sel_.onchange = () => loadMonth(sel_.value);
  $('btnRefresh').onclick = async () => { tl = await api('/api/refresh', {}); songs = await api('/api/songs'); drawAll(); };
  $('btnPreview').onclick = () => startRender(true);
  $('btnFinal').onclick = () => startRender(false);
  $('btnAddCard').onclick = async () => { await act('/api/card', {}); drawAll(); };

    setTimeout(() => { document.title = 'PLAY t=' + T.toFixed(2) + ' playing=' + playing + ' errors=' + errs.length + ' ' + errs.join(';'); pause(); }, 2500);

    const log = [];

  }
  if (location.hash === '#feat') {
    const log = []; window.onerror = (m) => log.push('JSERR ' + m);
    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    const K = kept();
    // 1. per-join transition: join 0 wipes (ends at the cut), join 1 stays default
    selectJoin(K[0].id); log.push('joinInsp:' + !!document.querySelector('#insp [data-j]'));
    K[0].transition_type = 'wipeleft'; K[0].transition_out = 1.0; K[0].transition_align = 'end';
    await save();
    const K2 = kept(), B = K2[1].start;
    setTime(B - 0.5); const wipe = media.get(K2[1].id).style.clipPath;      // inside the blend that ENDS at the cut
    setTime(B + 0.5); const after = media.get(K2[0].id) && media.get(K2[0].id).style.display;
    log.push('wipeMid:' + wipe.slice(0, 18), 'afterCutOldHidden:' + (after === 'none' || after === undefined));
    // 2. captions only inside their range
    addCaption(3); await save(); const c = tl.captions[tl.captions.length - 1];
    sel = { type:'cap', id:c.id };
    setTime(1.0); const before = capEls.size; setTime(3.5); const during = capEls.size; setTime(8.0); const later = capEls.size;
    log.push('cap before/during/after:' + before + '/' + during + '/' + later, 'bgDefault:' + c.background_opacity);
    // 3. add a layer, check "playing" then delete it with Backspace
    const lib = songs.find(s => s.source === 'library');

  if (location.hash === '#joindemo') {

}
async function loadMonth(name) {

// ------------------------------------------------------------------ settings panels
function drawPanels() {
  const open = new Set([...document.querySelectorAll('#panels details[open]')].map(d => d.dataset.t));
  const html = [musicPanel(open)];
  for (const p of SETTINGS) {
    html.push(`<details class="panel" data-t="${esc(p.title)}" ${open.has(p.title) ? 'open' : ''}><summary>${esc(p.title)}</summary><div class="fields">` +
      p.rows.map(([path, label, type, opt, key]) => {
        const v = getp(tl, path);
        let inp;
        if (type === 'select') inp = `<select data-p="${path}">${opt.map(o => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${val}" ${String(val) === String(v) ? 'selected' : ''}>${txt}</option>`; }).join('')}</select>`;
        else if (type === 'checkbox') inp = `<input type="checkbox" data-p="${path}" ${v ? 'checked' : ''}>`;
        else if (type === 'color') inp = `<input type="color" data-p="${path}" value="${hex(v)}">`;
        else if (type === 'range') inp = `<input type="range" data-p="${path}" min="${opt.min}" max="${opt.max}" step="${opt.step}" value="${v}"><span class="mut" style="width:42px">${Math.round(v * 100)}%</span>`;
        else inp = `<input type="number" data-p="${path}" ${Object.entries(opt).map(([k, x]) => `${k}="${x}"`).join(' ')} value="${v ?? ''}">`;
        return `<div class="row"><span>${esc(label)} ${i(key)}</span><span>${inp}</span></div>`;
      }).join('') + `</div></details>`);
  }
  $('panels').innerHTML = html.join('');
  document.querySelectorAll('#panels [data-p]').forEach(el => {
    el.onchange = () => {
      const t = el.type, numeric = t === 'number' || t === 'range' || ['beat_every'].includes(el.dataset.p);
      setp(tl, el.dataset.p, t === 'checkbox' ? el.checked : numeric ? parseFloat(el.value) : el.value);
      saveSoon();
    };
  });
  bindMusic();
}

  const laneName = (c) => c.lane === 0 ? (c.auto ? 'main' : 'lane 1') : (manual ? 'lane ' + (c.lane + 1) : 'layer ' + c.lane);
  return `<details class="panel" data-t="Music" ${open.has('Music') || !open.size ? 'open' : ''} style="grid-column:span 2"><summary>Music</summary><div class="fields">
    <div class="row"><span><b>Playing in this month</b> ${i('playlist')}</span>
      <span>${manual ? `<span class="badge">manual</span> <button id="toAuto" title="Go back to automatic fitting">Back to automatic</button>` : `<button id="toManual" title="Make the music editable in the timeline">Edit music by hand</button>`} ${i('manual')}</span></div>

        <button data-rc="${esc(c.id)}" title="Remove from the month (Backspace in the timeline)">✕</button></div>`).join('')
      : '<span class="mut">No music — this month is photos/clips only. Add a song below.</span>'}</div>
    ${manual ? `<div class="row"><span>Month length (s) ${i('manual_len')}</span><span>
        <input type="number" step="0.5" min="1" data-ml value="${tl.music.manual_length ?? ''}" placeholder="follows music ${fmt(tl.total)}">
        <button data-mlend title="Set the month length to where the music ends">follow the music</button></span></div>` : `
    <div class="row"><span><b>Playlist</b> <span class="mut">(what automatic fitting chooses from)</span></span></div>
    <div class="songs">${play.length ? play.map((f, n) => `<div class="song ${used.has(f) ? 'in' : ''}">
        <span class="n" title="${esc(f)}">${esc(songName(f))}</span><span class="mut">${dur(f)}${used.has(f) ? '' : ' · not used by this mode'}</span>

    <details id="availBox" ${availOpen ? 'open' : ''}><summary><b>Choose another song</b> <span class="mut">(${songs.length} available)</span> ${i('library')}</summary>

        <button data-sp="${esc(s.file)}" title="Listen">▶</button><span class="n" title="${esc(s.file)}">${esc(s.name)}</span>
        <span class="badge">${s.source}</span>${used.has(s.file) ? '<span class="badge ok">playing</span>' : ''}
        ${manual ? '' : (play.includes(s.file) ? '' : `<button data-pa="${esc(s.file)}" title="Let automatic fitting use it">Add to playlist</button>`)}
        <button data-pl="${esc(s.file)}" title="${manual ? 'Add to the timeline' : 'Play it on top of the main music'}">${manual ? 'Add to timeline' : 'Add as layer'}</button></div>`).join('') || '<span class="mut">No songs found in the month\'s music folder or the library folder.</span>'}</div>
      <div class="row" style="margin-top:8px"><span>Library folder ${i('library')}</span>

      <div class="row" style="margin-top:8px"><span>Section (loop_cut) ${i('section')}</span><input type="number" min="0" data-p="music.section" value="${tl.music.section}"></div>

function bindMusic() {
  const audio = $('songAudio');
  const ab = $('availBox'); if (ab) ab.ontoggle = () => { availOpen = ab.open; };
  document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => {
    const src = `/song?m=${encodeURIComponent(cur)}&file=${encodeURIComponent(b.dataset.sp)}`;
    if (audio.dataset.src === src && !audio.paused) { audio.pause(); b.textContent = '▶'; return; }
    pause();
    document.querySelectorAll('[data-sp]').forEach(x => x.textContent = '▶');
    audio.src = src; audio.dataset.src = src; audio.play(); b.textContent = '⏸';
  });
  document.querySelectorAll('[data-pa]').forEach(b => b.onclick = async () => { await act('/api/music', { action:'add', file:b.dataset.pa, timeline:tl }); songs = await api('/api/songs'); drawAll(); });
  document.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => addLayer(b.dataset.pl));
  document.querySelectorAll('[data-rc]').forEach(b => b.onclick = () => removeClip(b.dataset.rc));
  document.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => { tl.music.playlist = tl.music.playlist.filter(f => f !== b.dataset.pr); saveSoon(); });
  document.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => {
    const [n, d] = b.dataset.pm.split(':').map(Number), p = tl.music.playlist;
    if (n + d < 0 || n + d >= p.length) return;
    [p[n], p[n + d]] = [p[n + d], p[n]]; saveSoon();
  });
  const tm = $('toManual'); if (tm) tm.onclick = async () => { await act('/api/music', { action:'to_manual', timeline:tl }); sel = null; drawAll(); };
  const ta = $('toAuto'); if (ta) ta.onclick = () => { tl.music.mode = 'fit'; saveSoon(); };
  const ml = document.querySelector('[data-ml]'); if (ml) ml.onchange = () => { tl.music.manual_length = ml.value === '' ? null : parseFloat(ml.value); saveSoon(); };
  const me = document.querySelector('[data-mlend]'); if (me) me.onclick = () => { tl.music.manual_length = null; saveSoon(); };
  const set = $('libSet');
  if (set) set.onclick = async () => { tl.music.library = $('libPath').value.trim() || null; await act('/api/music', { action:'library', library:tl.music.library, timeline:tl }); songs = await api('/api/songs'); drawAll(); };
}

const keptIdx = () => tl.items.map((it, n) => it.keep ? n : -1).filter(n => n >= 0);

    head = `<img class="thumb" data-f="sel" loading="lazy" src="/thumb/${encodeURIComponent(cur)}/${enc(it.id)}${t}">`;
  }
  const defTrans = `default (${tl.transition.type}${tl.transition.type === 'cut' ? '' : ' ' + tl.transition.seconds + 's'})`;
  const last = keptIdx().slice(-1)[0] === idx;
  d.innerHTML = `${head}<div class="b">

    ${it.kind === 'card' ? `
      <div class="row"><span class="lbl">Colour <input type="color" data-f="color" value="${hex(it.color)}"> Text colour <input type="color" data-f="tcolor" value="${hex(it.text_color)}"></span></div>
      <input type="text" data-f="text" placeholder="optional centred text" value="${esc(it.text || '')}">` : `
      <div class="row"><label class="lbl"><input type="checkbox" data-f="keep" ${it.keep ? 'checked' : ''}> keep ${i('keep_item')}</label></div>`}

  }).join('');

  host.innerHTML = `<div class="ruler" id="ruler">${ticks}</div>
    <div class="lane" data-name="Clips" id="laneC">${clips}${joins}</div>
    <div class="lane" data-name="Captions" id="laneT">${caps}</div>${musLanes}<div id="playhead"></div>`;
  host.querySelectorAll('[data-ci]').forEach(b => b.onclick = () => selectItem(b.dataset.ci, false, true));
  host.querySelectorAll('[data-join]').forEach(b => b.onclick = (e) => { e.stopPropagation(); selectJoin(b.dataset.join); });
  host.querySelectorAll('[data-cap]').forEach(b => b.onpointerdown = (e) => tlDrag(e, b, 'cap'));
  host.querySelectorAll('[data-mc]').forEach(b => b.onpointerdown = (e) => tlDrag(e, b, 'mc'));
  const seek = (e) => { const r = host.getBoundingClientRect(); const t = Math.max(0, Math.min(total(), (e.clientX - r.left) / pps())); if (tab === 'live') setTime(t); else if ($('vid')) $('vid').currentTime = t; };
  $('ruler').onclick = seek; $('laneC').onclick = (e) => { if (e.target.id === 'laneC') seek(e); };
  $('laneT').onclick = (e) => { if (e.target.id === 'laneT') seek(e); };
  $('laneT').ondblclick = (e) => { if (e.target.id === 'laneT') { const r = host.getBoundingClientRect(); addCaption((e.clientX - r.left) / pps()); } };

}
function movePlayhead() {
  const t = curTime(), ph = $('playhead'); if (ph) ph.style.left = t * pps() + 'px';
  if (tab !== 'live') { const el = $('time'); if (el) el.textContent = `${t.toFixed(1)} / ${total().toFixed(1)}s`; }
}
function tlDrag(e, el, kind) {
  e.stopPropagation();
  const id = el.dataset.cap || el.dataset.mc;
  const obj = kind === 'cap' ? tl.captions.find(x => x.id === id) : tl.audio_clips.find(x => x.id === id);
  if (!obj) return;
  sel = { type:kind, id }; drawInspector();
  host_select(el);
  if (kind === 'mc' && obj.auto) return;           // automatic music: click to inspect, "Edit by hand" to move it
  const ref = kind === 'cap' ? obj : musicClipRef(id); if (!ref) return;
  const mode = e.target.dataset.h || 'm', x0 = e.clientX, p = pps();
  const snap = { s:ref.start, e: kind === 'cap' ? ref.end : ref.start + ref.src_out - ref.src_in, i: ref.src_in, o: ref.src_out };
  dragging = true; el.setPointerCapture(e.pointerId);
  el.onpointermove = (ev) => {
    const dt = (ev.clientX - x0) / p;

      if (mode === 'm') { const len = snap.e - snap.s; ref.start = Math.max(0, snap.s + dt); ref.end = ref.start + len; }
      else if (mode === 'l') ref.start = clamp(snap.s + dt, 0, snap.e - .3);
      else ref.end = Math.max(snap.s + .3, snap.e + dt);
      el.style.left = ref.start * p + 'px'; el.style.width = Math.max((ref.end - ref.start) * p, 8) + 'px';
    } else {
      if (mode === 'm') {
        ref.start = Math.max(0, snap.s + dt);
        const lanes = [...document.querySelectorAll('#tl .lane[data-lane]')];
        let L = null;
        for (const ln of lanes) { const r = ln.getBoundingClientRect(); if (ev.clientY >= r.top && ev.clientY < r.bottom) L = +ln.dataset.lane; }
        if (L === null && lanes.length) L = ev.clientY < lanes[0].getBoundingClientRect().top ? +lanes[0].dataset.lane : +lanes[lanes.length - 1].dataset.lane;
        if (L !== null) { if (L === 0 && tl.music.mode !== 'manual') L = 1; ref.lane = L; lanes.forEach(ln => ln.classList.toggle('drop', +ln.dataset.lane === L)); }
      }
      else if (mode === 'l') { const d = clamp(dt, -snap.i, snap.o - snap.i - .5); ref.src_in = snap.i + d; ref.start = Math.max(0, snap.s + d); }
      else ref.src_out = Math.max(snap.i + .5, snap.o + dt);
      el.style.left = ref.start * p + 'px'; el.style.width = Math.max((ref.src_out - ref.src_in) * p - 2, 8) + 'px';

}
function selectJoin(id) {
  sel = { type:'join', id };
  const K = kept(), n = K.findIndex(x => x.id === id);
  if (n >= 0 && n < K.length - 1) { if (tab === 'live') setTime(K[n + 1].start); else if ($('vid')) $('vid').currentTime = K[n + 1].start; }
  drawTimeline(); drawInspector();
}
function host_select(el) { document.querySelectorAll('#tl .blk').forEach(b => b.classList.toggle('sel', b === el)); }
function selectItem(id, fromCard, seekTo) {
  sel = { type:'item', id };
  const it = tl.items.find(x => x.id === id);
  if (it && it.start != null && (seekTo || fromCard)) { if (tab === 'live') setTime(it.start); else if ($('vid')) $('vid').currentTime = it.start; }
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.id === id));
  drawTimeline(); drawInspector();
  if (!fromCard) { const c = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`); if (c) c.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
}

// ------------------------------------------------------------------ captions
function addCaption(at) {
  const c = { id: uid(), text: 'New caption', start: Math.max(0, at), end: Math.min(total(), at + 3), ...tl.caption_style };
  if (c.end - c.start < 0.5) { c.start = Math.max(0, total() - 3); c.end = total(); }
  tl.captions.push(c); sel = { type:'cap', id:c.id }; drawInspector(); saveSoon();
}
function fillCapFields(o) {
  const box = $('insp'); if (!box) return;
  for (const k of ['x', 'y', 'size', 'rotation', 'start', 'end', 'src_in', 'src_out']) {
    const el = box.querySelector(`[data-c="${k}"]`); if (el && o[k] != null && document.activeElement !== el) el.value = k === 'x' || k === 'y' ? Math.round(o[k] * 100) : (Math.round(o[k] * 100) / 100);
  }
}

// font picker with live previews of every font
function fontPicker(host, current, onPick) {
  const cur = fonts.find(f => f.file === current);
  host.className = 'fp';
  host.innerHTML = `<button type="button" id="fpBtn" style="font-family:${fontFamily(current)}">${cur ? esc(cur.family + ' ' + cur.style) : 'Default font'}</button>`;
  ensureFont(current);
  const btn = host.querySelector('button');
  btn.onclick = () => {
    const old = host.querySelector('.list'); if (old) { old.remove(); return; }
    const list = document.createElement('div'); list.className = 'list';
    list.innerHTML = '<input type="text" placeholder="Search fonts…">';
    host.appendChild(list);
    const r = btn.getBoundingClientRect(), room = innerHeight - r.bottom - 12;
    const lw = Math.min(Math.max(r.width, 300), innerWidth - 16);
    list.style.left = Math.max(8, Math.min(r.left, innerWidth - lw - 8)) + 'px'; list.style.width = lw + 'px';
    if (room > 260) { list.style.top = r.bottom + 4 + 'px'; list.style.maxHeight = Math.min(380, room) + 'px'; }
    else { list.style.bottom = innerHeight - r.top + 4 + 'px'; list.style.maxHeight = Math.min(380, r.top - 12) + 'px'; }
    const io = new IntersectionObserver((es) => es.forEach(en => { if (en.isIntersecting) { const f = en.target.dataset.file; if (f) { ensureFont(f); en.target.querySelector('.sample').style.fontFamily = fontFamily(f); } io.unobserve(en.target); } }), { root:list });
    const draw = (q) => {
      list.querySelectorAll('.opt').forEach(o => o.remove());
      const rows = [{ file:'', family:'Default font', style:'' }, ...fonts].filter(f => !q || (f.family + ' ' + f.style).toLowerCase().includes(q.toLowerCase()));
      for (const f of rows) {
        const o = document.createElement('div'); o.className = 'opt' + (f.file === (current || '') ? ' cur' : ''); o.dataset.file = f.file;
        o.innerHTML = `<small>${esc(f.family)} ${esc(f.style)}</small><div class="sample">Happy summer 2025 — Aa Gg 123</div>`;
        o.onclick = () => { list.remove(); onPick(f.file); };
        list.appendChild(o); io.observe(o);
      }
    };
    draw('');
    list.querySelector('input').oninput = (e) => draw(e.target.value);
    list.querySelector('input').focus();
    const away = (ev) => { if (!host.contains(ev.target)) { list.remove(); document.removeEventListener('pointerdown', away, true); } };
    document.addEventListener('pointerdown', away, true);
  };
}

// ------------------------------------------------------------------ inspector (right panel)

  const src = it.source_duration || 0, a0 = it.src_in || 0, b0 = Math.min(src, a0 + (it.duration || 3));
  $('trimbox').innerHTML = `<div class="row"><b>Trim ${esc(it.id.split('/').pop())}</b><button id="trimX">✕</button></div>
    <video id="tv" controls src="/vproxy/${encodeURIComponent(cur)}/${enc(it.id)}"></video>
    <div id="range"><div class="sel" id="rsel"></div><div class="ph" id="rph"></div>
      <input type="range" id="rA" min="0" max="${src}" step="0.1" value="${a0}"><input type="range" id="rB" min="0" max="${src}" step="0.1" value="${b0}"></div>
    <div class="row"><span><label>starts at <input type="number" id="nA" step="0.1" min="0" max="${src}" value="${a0.toFixed(1)}"></label>
      <button id="setA">= current time</button></span>
      <span><label>ends at <input type="number" id="nB" step="0.1" min="0" max="${src}" value="${b0.toFixed(1)}"></label>
      <button id="setB">= current time</button></span>
      <span class="mut" id="tlen"></span></div>
    <div class="row"><span><button id="playSel">▶ Play selection</button> <button id="auto">Use auto (best moment)</button> ${i('trim')}</span>
      <span><button id="trimOk" class="primary">Save</button></span></div>`;
  const A = $('rA'), B = $('rB'), nA = $('nA'), nB = $('nB'), tv = $('tv');
  tv.onerror = () => { if (!tv.dataset.fb) { tv.dataset.fb = 1; tv.src = `/media/${encodeURIComponent(cur)}/${enc(it.id)}`; } };
  const upd = (from) => {
    let a = parseFloat(from === 'n' ? nA.value : A.value) || 0, b = parseFloat(from === 'n' ? nB.value : B.value) || 0;
    if (b - a < 0.3) { if (from === 'B' || from === 'nb') a = Math.max(0, b - 0.3); else b = Math.min(src, a + 0.3); }
    A.value = nA.value = a.toFixed(1); B.value = nB.value = b.toFixed(1);
    $('rsel').style.left = (a / src * 100) + '%'; $('rsel').style.width = ((b - a) / src * 100) + '%';
    $('tlen').textContent = 'plays ' + (b - a).toFixed(1) + 's';
  };
  A.oninput = () => { upd('A'); tv.currentTime = parseFloat(A.value); };
  B.oninput = () => { upd('B'); tv.currentTime = parseFloat(B.value); };
  nA.onchange = () => upd('n'); nB.onchange = () => upd('nb');
  $('setA').onclick = () => { nA.value = tv.currentTime.toFixed(1); upd('n'); };
  $('setB').onclick = () => { nB.value = tv.currentTime.toFixed(1); upd('nb'); };
  $('playSel').onclick = () => { tv.currentTime = parseFloat(A.value); tv.play(); };
  tv.ontimeupdate = () => { $('rph').style.left = (tv.currentTime / src * 100) + '%'; if (!tv.paused && tv.currentTime >= parseFloat(B.value)) tv.pause(); };
  $('trimX').onclick = closeTrim;
  $('auto').onclick = () => { it.src_in_auto = true; it.duration_override = null; closeTrim(); saveSoon(); };
  $('trimOk').onclick = () => { it.src_in = parseFloat(A.value); it.src_in_auto = false; it.duration_override = +(parseFloat(B.value) - parseFloat(A.value)).toFixed(2); closeTrim(); saveSoon(); };
  upd('A'); $('modal').style.display = 'grid';
}
function closeTrim() { const v = $('tv'); if (v) v.pause(); $('modal').style.display = 'none'; $('trimbox').innerHTML = ''; trimItem = null; }
$('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeTrim(); });
window.addEventListener('resize', () => { drawTimeline(); renderLive(); });

// ------------------------------------------------------------------ smoke test hook (used by automated checks)
async function smoke() {
  const log = [];
  try {
    const first = kept().find(x => x.kind !== 'card');
    selectItem(first.id, false, false); log.push('select');
    setTime(1.0); log.push('shown:' + shown.size);
    addCaption(1); await save(); log.push('caption:' + tl.captions.length);
    const c = tl.captions[tl.captions.length - 1]; c.x = .3; c.y = .3; c.rotation = -10; c.outline_width = 5; c.shadow = true; setTime(1.5);
    log.push('capEl:' + capEls.size + ':' + ($('caps').querySelector('.cap') ? $('caps').querySelector('.cap').style.transform : 'none'));
    log.push('fonts:' + fonts.length);
    const j = tl.items.find(x => x.keep && x.start > 5); if (j) { setTime(j.start); log.push('mid-cut'); }
    const lib = songs.find(s => s.source === 'library');
    if (lib) { $('layerSel').value = lib.file; await addLayer(); log.push('layers:' + tl.music.layers.length + ' lanes:' + document.querySelectorAll('#tl .lane').length); }
    const v = tl.items.find(x => x.kind === 'video'); if (v) { openTrim(v); log.push('trim:' + $('modal').style.display); closeTrim(); }
    document.querySelector('.i').click(); log.push('tip:' + $('tip').style.display);
    log.push('cards:' + document.querySelectorAll('#kept .card').length);
  } catch (e) { log.push('ERR ' + e.message); }
  document.title = 'SMOKE ' + log.join(' | ');
}
init();
</script>
