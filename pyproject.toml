[project]
name = "yearvideo"
version = "0.1.0"
description = "Automated yearly recap video builder (free/open-source tools only)"
requires-python = ">=3.11"
dependencies = ["pyyaml", "pillow", "imagehash", "numpy"]

[project.scripts]
yearvideo = "yearvideo.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
themes = ["onnxruntime", "tokenizers"]  # optional: group photos by what they show

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yearvideo = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
